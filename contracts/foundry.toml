[profile.default]
src = "src"
out = "out"
# Solidity bağımlılıkları pnpm ile kurulur (contracts/package.json); lib/ kullanılmaz.
libs = ["node_modules"]
test = "test"
script = "script"
# §7: Solidity ^0.8.24. OZ 5.7 bazı dosyalarında ^0.8.27 istediği için 0.8.28'e sabitlendi.
solc_version = "0.8.28"
# Fuji C-Chain (Etna sonrası) Cancun işlem kodlarını destekler.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[lint]
# Uçuş Planı zamana dayalıdır (24 sa kilit, openBy/reportBy, TR günü); saniye ölçeğindeki validatör oynaması
# dakika/saat pencerelerini anlamlı biçimde etkilemez.
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
fuji = "${FUJI_RPC}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
